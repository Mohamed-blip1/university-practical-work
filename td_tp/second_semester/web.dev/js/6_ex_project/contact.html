<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="style.css" />

    <title>Contact</title>
  </head>

  <body>
    <header>
      <nav id="nav-bar">
        <ul>
          <li><a href="index.html">Accueil</a></li>
          <li><a href="presentation.html">Presentation</a></li>
          <li><a href="loisirs.html">Loisirs</a></li>
          <li><a href="gallery.html">Gallery</a></li>
          <li><a class="active" href="contact.html">Contact</a></li>
        </ul>
      </nav>
    </header>

    <article id="start">
      <section>
        <div id="clock">
          <div id="dDate"></div>
          <div id="dTime"></div>
        </div>
      </section>

      <div id="setting">
        <button id="mode-button" onclick="toggleLightMode()">Sombre</button>

        <div id="color-buttons">
          <button
            id="color-button-purple"
            onclick="toggleColor('purple')"
          ></button>
          <button
            id="color-button-brown"
            onclick="toggleColor('brown')"
          ></button>
          <button id="color-button-default" onclick="toggleColor('')"></button>
        </div>
      </div>

      <article class="contact">
        <h1>Contact</h1>
        <fieldset>
          <legend>Vos Info</legend>
          <form action="https://httpbin.org/get" method="get" target="_blank">
            <p>
              <label style="width: 80px; display: inline-block" for="nom"
                >Nom:</label
              >
              <input type="text" id="nom" name="nom" placeholder="Vos nom" />
            </p>

            <p>
              <label style="width: 80px; display: inline-block" for="Prénom"
                >Prénom:</label
              >
              <input
                type="text"
                id="Prénom"
                name="Prénom"
                placeholder="Vos Prénom"
              />
            </p>
            <p>
              <label style="width: 80px; display: inline-block" for="Email"
                >Email:</label
              >
              <input
                type="email"
                id="Email"
                name="Email"
                placeholder="Vos Email"
              />
            </p>

            <p>
              <label style="width: 80px; display: inline-block" for="Message"
                >Message:</label
              >
              <textarea id="Message" name="Message" placeholder=""></textarea>
            </p>

            <input type="submit" value="Envoyer" />
          </form>
        </fieldset>
      </article>
    </article>

    <footer>
      <hr />
      <p>&copy; 2026 Mohamed Bouharti</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>

<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />

    <title>JS</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div id="calculator">
      <input type="text" readonly id="display" />
      <div id="keys">
        <button id="key" onclick="addToDisplay('+')" class="defKeyColor">
          +
        </button>
        <button id="key" onclick="addToDisplay('7')">7</button>
        <button id="key" onclick="addToDisplay('8')">8</button>
        <button id="key" onclick="addToDisplay('9')">9</button>
        <button id="key" onclick="addToDisplay('-')" class="defKeyColor">
          -
        </button>
        <button id="key" onclick="addToDisplay('4')">4</button>
        <button id="key" onclick="addToDisplay('5')">5</button>
        <button id="key" onclick="addToDisplay('6')">6</button>
        <button id="key" onclick="addToDisplay('*')" class="defKeyColor">
          *
        </button>
        <button id="key" onclick="addToDisplay('1')">1</button>
        <button id="key" onclick="addToDisplay('2')">2</button>
        <button id="key" onclick="addToDisplay('3')">3</button>
        <button id="key" onclick="addToDisplay('/')" class="defKeyColor">
          /
        </button>
        <button id="key" onclick="addToDisplay('0')">0</button>
        <button id="key" onclick="addToDisplay('.')">.</button>
        <button id="key" onclick="calculate()">=</button>
        <button id="key" onclick="clearDisplay()" class="defKeyColor">C</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
